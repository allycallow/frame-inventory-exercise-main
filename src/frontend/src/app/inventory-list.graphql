query Frames($page: Int!, $statuses: [String!], $search: String) {
  frames(page: $page, size: 25, statuses: $statuses, search: $search) {
    page
    size
    hasNext
    items {
      frameId
      attributes {
        status
        environment
        siteNo
        address
        location {
          town
          postcode
        }
        format {
          technology
          formatCode
        }
      }
    }
  }
}

query FrameHistory($id: ID!) {
  frameHistory(frameId: $id) {
    versionId
    validFrom
    validTo
    current
    changeSource
    closedByChangeSource
    importJobId
    attributes {
      status
      statusReason
    }
  }
}
