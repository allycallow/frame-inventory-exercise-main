query Frames($page: Int!, $statuses: [String!], $search: String) {
  frames(page: $page, size: 25, statuses: $statuses, search: $search) {
    page
    size
    hasNext
    items {
      frameId
      attributes {
        status
        environment
        siteNo
        address
        location {
          town
          postcode
        }
        format {
          technology
          formatCode
        }
      }
    }
  }
}
