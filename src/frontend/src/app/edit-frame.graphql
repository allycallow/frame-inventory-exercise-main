query FrameForEdit($frameId: ID!) {
  frame(frameId: $frameId) {
    frameId
    versionId
    current
    attributes {
      status
      statusReason
      siteNo
      inventorySiteNo
      panelNumber
      locationId
      environment
      address
      station
      airport
      latitude
      longitude
      distanceToClosestSchool
      location {
        countryCode
        region
        town
        postcode
      }
      format {
        technology
        formatCode
        sizeGroupCode
      }
      sizeCode
      aspectRatioCode
      tSize
      pixelHeight
      pixelWidth
      illuminationTypeId
      numberOfSlots
      impactWeight
      premium
      productionRateCard
      productionRateCardLegacy
      pricingGrade
    }
  }
}

mutation UpdateFrame($frameId: ID!, $expectedVersionId: String!, $attributes: FrameAttributesInput!) {
  updateFrame(frameId: $frameId, expectedVersionId: $expectedVersionId, attributes: $attributes) {
    frameId
  }
}
