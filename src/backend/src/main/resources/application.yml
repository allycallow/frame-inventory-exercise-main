server:
  port: 8080

spring:
  application:
    name: frame-inventory-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/frames
    username: app
    password: app

management:
  endpoints:
    web:
      exposure:
        include: health,info

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  data-collection:
    user-info: false
