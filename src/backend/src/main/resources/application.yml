server:
  port: 8080

logging:
  structured:
    format:
      console: logstash

spring:
  application:
    name: frame-inventory-backend
  grpc:
    server:
      port: 9090
  datasource:
    url: jdbc:postgresql://localhost:5432/frames
    username: app
    password: app

management:
  endpoints:
    web:
      exposure:
        include: health,info
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
        "[grpc.server]": true

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  data-collection:
    user-info: false
