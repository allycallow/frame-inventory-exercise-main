receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: frame-inventory-backend
          scrape_interval: 15s
          metrics_path: /actuator/prometheus
          static_configs:
            - targets: ["backend:8080"]

exporters:
  prometheus:
    endpoint: "0.0.0.0:9464"

service:
  pipelines:
    metrics:
      receivers: [prometheus]
      exporters: [prometheus]
